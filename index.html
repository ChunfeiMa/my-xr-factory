<!doctype html>
<html lang="en">
  <head>
    <title>SK Hynix XR | Advanced SOP Monitor v5.3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <style>
      xr-button, .xr-button-container {
        display: flex !important;
        position: fixed !important;
        bottom: 50px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        z-index: 100000 !important;
        background: #f15a24 !important;
        border-radius: 8px !important;
        padding: 10px 20px !important;
        cursor: pointer !important;
      }

      #debug-log {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.8);
        color: #00ff00;
        padding: 12px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        z-index: 9999;
        pointer-events: none;
        border-radius: 4px;
        border: 1px solid #f15a24;
        max-width: 300px;
      }
    </style>
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
          "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
          "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
          "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
          "bidi-js": "https://esm.sh/bidi-js@%5E1.0.2?target=es2022",
          "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",
          "lit": "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js",
          "lit/": "https://esm.run/lit@3/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="debug-log">System: SK Hynix OS v5.3 initializing UI...</div>

    <script type="module">
      import 'xrblocks/addons/simulator/SimulatorAddons.js';
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      const log = (msg) => {
        const el = document.getElementById('debug-log');
        if (el) el.innerHTML += `<br>> ${msg}`;
        console.log(`[FabOS] ${msg}`);
      };

      class FactoryScript extends xb.Script {
        constructor() {
          super();
          this.items = [];
          this.conveyorSpeed = 0.02;
          this.isStopped = false;
          this.productionCount = 0;
          this.time = 0;
          this.currentStepIndex = 0;
          this.steps = [
            "1. FOUP Load Verification",
            "2. Laser Surface Scanning",
            "3. Defect Map Generation",
            "4. Sorting Mechanism",
            "5. Final Batch Output"
          ];
          this.stepRowRefs = [];
          this.stepTextRefs = [];
        }

        init() {
          log("Building Intelligent UI Components...");
          
          this.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
          const sun = new THREE.DirectionalLight(0xffffff, 1.5);
          sun.position.set(5, 15, 5);
          this.add(sun);

          this.createBackgroundHall();
          this.createConveyor();

          for (let i = 0; i < 8; i++) {
            this.createProductionItem(i * 1.8 - 12.0);
          }

          this.createRoboticArm();
          this.createControlPanel(); 
          this.createHumanoidRobot();
          this.createTaskMonitorPanel();
          
          log("Fab Environment Ready.");
        }

        createBackgroundHall() {
          const hall = new THREE.Group();
          const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x000000, transparent: true, opacity: 0.1 })
          );
          floor.rotation.x = -Math.PI / 2;
          hall.add(floor);

          const wall = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 40),
            new THREE.MeshStandardMaterial({ color: 0x000000, transparent: true, opacity: 0.1 })
          );
          wall.position.set(0, 20, -20);
          hall.add(wall);
          this.add(hall);
        }

        createConveyor() {
          const group = new THREE.Group();
          const belt = new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 0.2, 20.0),
            new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 })
          );
          belt.position.set(0, 0.5, -10.0); 
          group.add(belt);

          this.laser = new THREE.Mesh(
            new THREE.BoxGeometry(1.8, 0.02, 0.02),
            new THREE.MeshBasicMaterial({ color: 0xff0000 })
          );
          this.laser.position.set(0, 1.0, -3.0);
          group.add(this.laser);
          this.add(group);
        }

        createProductionItem(zPos) {
          const item = new THREE.Group();
          const pod = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.5, 0.5),
            new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.5, metalness: 0.9 })
          );
          item.add(pod);
          item.position.set(0, 0.85, zPos);
          this.add(item);
          this.items.push(item);
        }

        createHumanoidRobot() {
          this.robot = new THREE.Group();
          this.robot.position.set(-1.4, 0, -3.0); 
          this.robot.rotation.y = Math.PI / 4;
          const metal = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.1 });
          const torso = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.25), metal);
          torso.position.y = 1.1;
          this.robot.add(torso);
          this.robotHead = new THREE.Group();
          this.robotHead.position.y = 1.5;
          const head = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), metal);
          this.robotHead.add(head);
          const visor = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.06, 0.1), new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: 0x00ccff, emissiveIntensity: 2 }));
          visor.position.set(0, 0.05, 0.1);
          this.robotHead.add(visor);
          this.robot.add(this.robotHead);
          this.add(this.robot);
        }

        createRoboticArm() {
          this.armRoot = new THREE.Group();
          this.armRoot.position.set(1.2, 0.5, -5.0);
          const base = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.4), new THREE.MeshStandardMaterial({color: 0x333333}));
          this.armRoot.add(base);
          this.joint = new THREE.Group();
          this.joint.position.y = 0.3;
          this.armRoot.add(this.joint);
          const seg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.5, 0.15), new THREE.MeshStandardMaterial({color: 0xffcc00}));
          seg.position.y = 0.7;
          this.joint.add(seg);
          this.add(this.armRoot);
        }

        createControlPanel() {
          const panel = new xb.SpatialPanel({ width: 1.2, height: 0.8, backgroundColor: '#000000dd' });
          panel.position.set(-2.2, 1.8, -4.0);
          panel.rotation.y = 0.6;
          this.add(panel);
          const grid = panel.addGrid();
          grid.addRow({weight: 0.3}).addText({ text: 'SK HYNIX FAB OS\nControl Center', fontSize: 0.07, fontColor: '#f15a24' });
          this.statDisplay = grid.addRow({weight: 0.3}).addText({ text: 'STATUS: ACTIVE\nOUTPUT: 0 WAFERS', fontSize: 0.05 });
          const btns = grid.addRow({weight: 0.4});
          btns.addCol({weight: 0.5}).addTextButton({ text: 'PAUSE', backgroundColor: '#ed1c24', fontSize: 0.1 }).onTriggered = () => { this.isStopped = !this.isStopped; };
          btns.addCol({weight: 0.5}).addTextButton({ text: 'BOOST', backgroundColor: '#388e3c', fontSize: 0.1 }).onTriggered = () => { this.conveyorSpeed = Math.min(this.conveyorSpeed + 0.03, 0.3); };
        }

        // --- ENHANCED TASK MONITOR PANEL ---
        createTaskMonitorPanel() {
          const panel = new xb.SpatialPanel({
            width: 2.8, 
            height: 1.6,
            backgroundColor: '#121212f0'
          });
          panel.position.set(1.8, 1.8, -3.5); 
          panel.rotation.y = -0.6;
          this.add(panel);

          const mainGrid = panel.addGrid();
          
          // Header Bar
          const header = mainGrid.addRow({weight: 0.1}).addPanel({backgroundColor: '#1f1f1f'});
          header.addGrid().addText({
            text: ' AI TASK DIAGNOSIS SYSTEM - Wafer Fabrication SOP v1.4',
            fontSize: 0.05,
            textAlign: 'left',
            fontColor: '#ffffff'
          });

          const bodyRow = mainGrid.addRow({weight: 0.9});
          
          // LEFT COLUMN: Standard Operating Procedure
          const leftCol = bodyRow.addCol({weight: 0.5});
          const leftGrid = leftCol.addGrid();
          
          // 1. Standard Video Placeholder
          const videoArea = leftGrid.addRow({weight: 0.45}).addPanel({backgroundColor: '#000000'});
          const videoGrid = videoArea.addGrid();
          videoGrid.addRow({weight: 0.8}).addText({text: 'STANDARD PROCEDURE VIDEO\n[PLAYBACK: 00:45 / 04:30]', fontSize: 0.04, fontColor: '#666'});
          // Progress bar mockup
          videoGrid.addRow({weight: 0.2}).addPanel({backgroundColor: '#333'}).addGrid().addCol({weight: 0.2}).addPanel({backgroundColor: '#9c27b0'});

          // 2. Step List Area
          const stepList = leftGrid.addRow({weight: 0.55}).addGrid();
          this.steps.forEach((s) => {
            const stepRow = stepList.addRow({weight: 0.2}).addPanel({backgroundColor: '#1a1a1a'});
            const stepText = stepRow.addGrid().addText({
              text: `  ${s}`,
              fontSize: 0.038,
              textAlign: 'left',
              fontColor: '#888888'
            });
            this.stepRowRefs.push(stepRow);
            this.stepTextRefs.push(stepText);
          });

          // RIGHT COLUMN: Live Analysis
          const rightCol = bodyRow.addCol({weight: 0.5});
          const rightGrid = rightCol.addGrid();

          // 1. Live Feed with Scanning Overlay
          const liveArea = rightGrid.addRow({weight: 0.45}).addPanel({backgroundColor: '#000000'});
          const liveGrid = liveArea.addGrid();
          liveGrid.addRow({weight: 0.8}).addText({text: 'LIVE AI ANALYSIS FEED\nFPS: 60 | LATENCY: 2ms', fontSize: 0.04, fontColor: '#00ff00'});
          // Laser scan line mockup
          this.scanLineRow = liveGrid.addRow({weight: 0.2}).addPanel({backgroundColor: '#003300'});

          // 2. Diagnosis Data
          const diagArea = rightGrid.addRow({weight: 0.55}).addPanel({backgroundColor: '#1a1a1a'});
          const diagGrid = diagArea.addGrid();
          diagGrid.addRow({weight: 0.25}).addText({text: 'DIAGNOSIS RESULTS', fontSize: 0.05, fontColor: '#f15a24'});
          
          this.accuracyText = diagGrid.addRow({weight: 0.25}).addText({text: 'Match: 99.8%', fontSize: 0.06, fontColor: '#00e5ff'});
          this.detailsText = diagGrid.addRow({weight: 0.5}).addText({
            text: 'Analyzing positioning...\nAlignment: OK\nSurface Check: PASSED',
            fontSize: 0.035,
            fontColor: '#ffffff',
            textAlign: 'left'
          });
        }

        update() {
          if (this.isStopped) return;
          const dt = xb.getDeltaTime();
          this.time += dt;

          // 1. Move Conveyor Items
          let nearestItem = null;
          let minDistance = Infinity;

          this.items.forEach(item => {
            item.position.z += this.conveyorSpeed;
            const dist = Math.abs(item.position.z - (-3.0));
            if (dist < minDistance) {
                minDistance = dist;
                nearestItem = item;
            }
            if (item.position.z > 2.0) {
              item.position.z = -15.0;
              this.productionCount++;
              if (this.statDisplay) this.statDisplay.setText(`STATUS: ACTIVE\nOUTPUT: ${this.productionCount} WAFERS`);
            }
          });

          // 2. Robot Tracking
          if (this.robotHead && nearestItem) {
            this.robotHead.lookAt(nearestItem.position);
            this.robotHead.rotation.y += Math.PI; 
          }

          // 3. Update Task Monitor Logic
          const stepIndex = Math.floor((this.time * 0.4) % this.steps.length);
          if (this.stepTextRefs.length > 0 && stepIndex !== this.currentStepIndex) {
            this.currentStepIndex = stepIndex;
            this.stepRowRefs.forEach((row, idx) => {
              if (idx < stepIndex) {
                row.setBackgroundColor('#1b5e20'); // Done - Green
                this.stepTextRefs[idx].setFontColor('#ffffff');
                this.stepTextRefs[idx].setText(`  \u2713 ${this.steps[idx]}`); // Checkmark
              } else if (idx === stepIndex) {
                row.setBackgroundColor('#4a148c'); // Active - Deep Purple (Image Ref)
                this.stepTextRefs[idx].setFontColor('#ffffff');
                this.stepTextRefs[idx].setText(`  \u25B6 ${this.steps[idx]}`); // Play Arrow
              } else {
                row.setBackgroundColor('#1a1a1a'); // Pending
                this.stepTextRefs[idx].setFontColor('#888888');
                this.stepTextRefs[idx].setText(`  ${this.steps[idx]}`);
              }
            });

            if (this.accuracyText) {
                const acc = (99.5 + Math.random() * 0.4).toFixed(1);
                this.accuracyText.setText(`Match: ${acc}%`);
            }
          }

          // Move mockup scan line
          if (this.scanLineRow) {
              const pulse = (Math.sin(this.time * 5) + 1) / 2;
              this.scanLineRow.setBackgroundColor(`rgba(0, 255, 0, ${pulse * 0.5})`);
          }

          if (this.conveyorSpeed > 0.02) this.conveyorSpeed -= 0.0001;
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        const options = new xb.Options();
        options.enableUI();
        options.enableHands();
        options.hands.visualization = true;
        options.controllers.visualizeRays = true;
        options.xrButton.startText = 'ENTER SMART FAB';
        
        options.simulator.cameraPosition = new THREE.Vector3(0, 3, 5);
        options.simulator.lookAt = new THREE.Vector3(0, 0, -4);

        xb.add(new FactoryScript());
        try {
          await xb.init(options);
          log("SOP System Linked Successfully.");
        } catch (e) { log(`Error: ${e.message}`); }
      });
    </script>
  </body>
</html>
