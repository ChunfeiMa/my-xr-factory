<!doctype html>
<html lang="en">
  <head>
    <title>XR Factory Simulation | Quest 3 Ready</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
          "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
          "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
          "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
          "bidi-js": "https://esm.sh/bidi-js@%5E1.0.2?target=es2022",
          "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",
          "lit": "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js",
          "lit/": "https://esm.run/lit@3/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/addons/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      class FactoryScript extends xb.Script {
        constructor() {
          super();
          this.items = [];
          this.conveyorSpeed = 0.01;
          this.isStopped = false;
          this.productionCount = 0;
          this.time = 0;
        }

        init() {
          // 1. Lighting (Bright factory lighting)
          this.add(new THREE.HemisphereLight(0xffffff, 0xbbbbbb, 2));
          const sun = new THREE.DirectionalLight(0xffffff, 1.5);
          sun.position.set(5, 10, 5);
          this.add(sun);

          // 2. Conveyor Belt Base
          const beltGeo = new THREE.BoxGeometry(0.6, 0.1, 4.0);
          const beltMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
          this.belt = new THREE.Mesh(beltGeo, beltMat);
          this.belt.position.set(0, 0.7, -1.5);
          this.add(this.belt);

          // 3. Spawning production items (Crates)
          for (let i = 0; i < 5; i++) {
            this.createCrate(i * 0.8 - 1.5);
          }

          // 4. Robotic Arm
          this.createRoboticArm();

          // 5. Control Panel UI
          this.createControlPanel();

          // 6. Floor (Visible in VR mode, invisible/Passthrough in AR mode)
          const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshShadowMaterial({ opacity: 0.2 })
          );
          floor.rotation.x = -Math.PI / 2;
          this.add(floor);
        }

        createCrate(zPos) {
          const crateGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
          const crateMat = new THREE.MeshPhongMaterial({ color: 0xd2691e });
          const crate = new THREE.Mesh(crateGeo, crateMat);
          crate.position.set(0, 0.85, zPos);
          this.add(crate);
          this.items.push(crate);
        }

        createRoboticArm() {
          this.armRoot = new THREE.Group();
          this.armRoot.position.set(0.5, 0.75, -1.5);

          const base = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.1, 0.2),
            new THREE.MeshPhongMaterial({ color: 0x777777 })
          );
          this.armRoot.add(base);

          this.upperArm = new THREE.Mesh(
            new THREE.BoxGeometry(0.05, 0.4, 0.05),
            new THREE.MeshPhongMaterial({ color: 0xffcc00 })
          );
          this.upperArm.position.y = 0.2;
          this.armRoot.add(this.upperArm);

          this.add(this.armRoot);
        }

        createControlPanel() {
          const panel = new xb.SpatialPanel({
            width: 1.0,
            height: 0.8,
            backgroundColor: '#1a1a1aff'
          });
          panel.position.set(-0.8, 1.4, -1.2);
          panel.rotation.y = 0.5;
          this.add(panel);

          const grid = panel.addGrid();
          grid.addRow({weight: 0.2}).addText({
            text: 'QUEST FACTORY',
            fontSize: 0.06,
            fontColor: '#00ccff'
          });

          this.statDisplay = grid.addRow({weight: 0.3}).addText({
            text: 'Status: OPERATIONAL\nUnits: 0',
            fontSize: 0.04
          });

          const btnRow = grid.addRow({weight: 0.4});
          
          const stopBtn = btnRow.addCol({weight: 0.5}).addTextButton({
            text: 'STOP',
            backgroundColor: '#aa0000',
            fontSize: 0.15
          });
          stopBtn.onTriggered = () => this.toggleFactory();

          const speedBtn = btnRow.addCol({weight: 0.5}).addTextButton({
            text: 'BOOST',
            backgroundColor: '#00aa00',
            fontSize: 0.15
          });
          speedBtn.onTriggered = () => { this.conveyorSpeed = 0.04; };
        }

        toggleFactory() {
          this.isStopped = !this.isStopped;
          this.statDisplay.setText(
            `Status: ${this.isStopped ? 'STOPPED' : 'OPERATIONAL'}\nUnits: ${this.productionCount}`
          );
        }

        update() {
          if (this.isStopped) return;

          this.time += xb.getDeltaTime();
          const speed = this.conveyorSpeed;

          this.items.forEach(item => {
            item.position.z += speed;
            if (item.position.z > 0.5) {
              item.position.z = -3.0;
              this.productionCount++;
              this.statDisplay.setText(
                `Status: OPERATIONAL\nUnits: ${this.productionCount}`
              );
            }
          });

          if (this.armRoot) {
            this.armRoot.rotation.y = Math.sin(this.time * 2) * 0.5;
            this.upperArm.rotation.x = Math.cos(this.time * 4) * 0.3;
          }

          if (this.conveyorSpeed > 0.01) {
             this.conveyorSpeed -= 0.0001;
          }
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const options = new xb.Options();
        options.enableUI();
        
        // Ensure standard WebXR buttons are used for Meta Quest compatibility
        options.xrButton.startText = 'ENTER FACTORY';
        
        xb.add(new FactoryScript());
        xb.init(options);
      });
    </script>
  </body>
</html>
