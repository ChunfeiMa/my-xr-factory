<!doctype html>
<html lang="en">
  <head>
    <title>XR Factory Simulation | SK Hynix Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <style>
      #debug-log {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.85);
        color: #00ff00;
        padding: 12px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        z-index: 9999;
        pointer-events: none;
        border-radius: 4px;
        border: 1px solid #00ccff;
        max-width: 300px;
      }
    </style>
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
          "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
          "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
          "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
          "bidi-js": "https://esm.sh/bidi-js@%5E1.0.2?target=es2022",
          "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",
          "lit": "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js",
          "lit/": "https://esm.run/lit@3/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="debug-log">System: Initializing SK Hynix Facility...</div>

    <script type="module">
      import 'xrblocks/addons/simulator/SimulatorAddons.js';
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      const log = (msg) => {
        const el = document.getElementById('debug-log');
        if (el) el.innerHTML += `<br>> ${msg}`;
        console.log(`[FactoryLog] ${msg}`);
      };

      class FactoryScript extends xb.Script {
        constructor() {
          super();
          this.items = [];
          this.conveyorSpeed = 0.015;
          this.isStopped = false;
          this.productionCount = 0;
          this.time = 0;
          this.statDisplay = null;
        }

        init() {
          log("Building Factory Hall...");
          
          // Environment Lighting - Brighter for better logo visibility
          this.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
          const sun = new THREE.DirectionalLight(0xffffff, 2.5);
          sun.position.set(2, 10, 5);
          sun.castShadow = true;
          this.add(sun);

          // 1. Background Hall
          this.createBackgroundHall();

          // 2. Branding Stand (Logo placed here for high visibility)
          this.createLogoStand();

          // 3. Conveyor Belt
          const beltGeo = new THREE.BoxGeometry(0.8, 0.1, 8.0);
          const beltMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
          this.belt = new THREE.Mesh(beltGeo, beltMat);
          this.belt.position.set(0, 0.8, -3.5);
          this.belt.receiveShadow = true;
          this.add(this.belt);

          // 4. Production Items
          for (let i = 0; i < 8; i++) {
            this.createCrate(i * 1.0 - 7.5);
          }

          // 5. Mechanical components
          this.createRoboticArm();
          this.createControlPanel();
          
          log("Facility Online.");
        }

        createBackgroundHall() {
          const hallGroup = new THREE.Group();
          
          // Floor
          const floorGeo = new THREE.PlaneGeometry(60, 60);
          const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a1a, 
            roughness: 0.85 
          });
          const floor = new THREE.Mesh(floorGeo, floorMat);
          floor.rotation.x = -Math.PI / 2;
          floor.receiveShadow = true;
          hallGroup.add(floor);

          // Back Wall (Darker to make foreground stand out)
          const wallMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a });
          const backWall = new THREE.Mesh(new THREE.PlaneGeometry(60, 25), wallMat);
          backWall.position.set(0, 12.5, -15);
          hallGroup.add(backWall);

          // Industrial Pillars
          const pillarGeo = new THREE.BoxGeometry(0.6, 25, 0.6);
          const pillarMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
          
          for (let i = -3; i <= 3; i++) {
            const pillarL = new THREE.Mesh(pillarGeo, pillarMat);
            pillarL.position.set(-10, 12.5, i * 8 - 5);
            hallGroup.add(pillarL);

            const pillarR = new THREE.Mesh(pillarGeo, pillarMat);
            pillarR.position.set(10, 12.5, i * 8 - 5);
            hallGroup.add(pillarR);

            const beamGeo = new THREE.BoxGeometry(20, 0.5, 0.5);
            const beam = new THREE.Mesh(beamGeo, pillarMat);
            beam.position.set(0, 24.5, i * 8 - 5);
            hallGroup.add(beam);
          }

          this.add(hallGroup);
        }

        createLogoStand() {
          const standGroup = new THREE.Group();
          standGroup.position.set(0, 2.5, -5.5); // Positioned closely behind the belt

          // White Background Plane for Logo (Crucial for clear visibility)
          const bgGeo = new THREE.PlaneGeometry(3.5, 1.8);
          const bgMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
          const background = new THREE.Mesh(bgGeo, bgMat);
          standGroup.add(background);

          // SK HYNIX LOGO
          const logoTexture = new THREE.TextureLoader().load('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/SK_hynix_logo.svg/1024px-SK_hynix_logo.svg.png');
          const logoGeo = new THREE.PlaneGeometry(3.2, 1.5);
          const logoMat = new THREE.MeshBasicMaterial({ 
            map: logoTexture,
            transparent: true,
          });
          const logoSign = new THREE.Mesh(logoGeo, logoMat);
          logoSign.position.z = 0.01; // Slightly in front of white plane
          standGroup.add(logoSign);

          // Glowing Frame
          const frameGeo = new THREE.BoxGeometry(3.7, 2.0, 0.1);
          const frameMat = new THREE.MeshStandardMaterial({ 
            color: 0xf15a24, 
            emissive: 0xf15a24, 
            emissiveIntensity: 1.0 
          });
          const frame = new THREE.Mesh(frameGeo, frameMat);
          frame.position.z = -0.06;
          standGroup.add(frame);

          // Support Stand
          const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 2.5);
          const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
          const pole = new THREE.Mesh(poleGeo, poleMat);
          pole.position.set(0, -2.0, -0.1);
          standGroup.add(pole);

          this.add(standGroup);
        }

        createCrate(zPos) {
          const crateGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
          const crateMat = new THREE.MeshStandardMaterial({ color: 0xcd853f });
          const crate = new THREE.Mesh(crateGeo, crateMat);
          crate.position.set(0, 1.05, zPos);
          crate.castShadow = true;
          this.add(crate);
          this.items.push(crate);
        }

        createRoboticArm() {
          this.armGroup = new THREE.Group();
          this.armGroup.position.set(0.8, 0.8, -3.0);

          const base = new THREE.Mesh(
            new THREE.CylinderGeometry(0.18, 0.18, 0.3),
            new THREE.MeshStandardMaterial({ color: 0x444444 })
          );
          this.armGroup.add(base);

          this.armJoint = new THREE.Group();
          this.armJoint.position.y = 0.15;
          this.armGroup.add(this.armJoint);

          this.upperArm = new THREE.Mesh(
            new THREE.BoxGeometry(0.12, 1.0, 0.12),
            new THREE.MeshStandardMaterial({ color: 0xffd700 })
          );
          this.upperArm.position.y = 0.5;
          this.armJoint.add(this.upperArm);

          this.add(this.armGroup);
        }

        createControlPanel() {
          const panel = new xb.SpatialPanel({
            width: 1.25,
            height: 1.0,
            backgroundColor: '#000000ee'
          });
          panel.position.set(-1.4, 1.8, -2.2);
          panel.rotation.y = 0.5;
          this.add(panel);

          const grid = panel.addGrid();
          grid.addRow({weight: 0.25}).addText({
            text: 'SK HYNIX CORE OS',
            fontSize: 0.09,
            fontColor: '#f15a24' 
          });

          this.statDisplay = grid.addRow({weight: 0.3}).addText({
            text: 'SYSTEM: AUTHENTICATED\nUNIT SCANNER ACTIVE',
            fontSize: 0.05,
            fontColor: '#ffffff'
          });

          const ctrlRow = grid.addRow({weight: 0.45});
          
          ctrlRow.addCol({weight: 0.5}).addTextButton({
            text: 'ENGAGE',
            backgroundColor: '#ed1c24', 
            fontSize: 0.12
          }).onTriggered = () => this.toggleFactory();

          ctrlRow.addCol({weight: 0.5}).addTextButton({
            text: 'BOOST',
            backgroundColor: '#388e3c',
            fontSize: 0.12
          }).onTriggered = () => { 
            this.conveyorSpeed = Math.min(this.conveyorSpeed + 0.02, 0.15); 
            log("Core Performance Boosted");
          };
        }

        toggleFactory() {
          this.isStopped = !this.isStopped;
          log(`Operation ${this.isStopped ? 'Suspended' : 'Resumed'}`);
          this.updateStats();
        }

        updateStats() {
          if (this.statDisplay) {
            const status = this.isStopped ? 'PAUSED' : 'OPTIMAL';
            this.statDisplay.setText(`SYSTEM: ${status}\nPROCESSED: ${this.productionCount} UNITS`);
          }
        }

        update() {
          if (this.isStopped) return;
          
          const dt = xb.getDeltaTime();
          this.time += dt;

          this.items.forEach(item => {
            item.position.z += this.conveyorSpeed;
            if (item.position.z > 0.5) {
              item.position.z = -7.5; 
              this.productionCount++;
              this.updateStats();
            }
          });

          if (this.armJoint) {
            this.armJoint.rotation.y = Math.sin(this.time * 1.0) * 1.2;
            this.armJoint.rotation.z = Math.cos(this.time * 1.5) * 0.4;
          }

          if (this.conveyorSpeed > 0.015) {
            this.conveyorSpeed -= 0.0001;
          }
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        log("System Link Initializing...");

        const options = new xb.Options();
        options.enableUI();
        options.xrButton.startText = 'START PRODUCTION';
        
        xb.add(new FactoryScript());
        
        try {
          await xb.init(options);
          log("SK Hynix Authorized Link Ready.");
        } catch (err) {
          log(`Error: ${err.message}`);
        }
      });
    </script>
  </body>
</html>
