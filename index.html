<!doctype html>
<html lang="en">
  <head>
    <title>SK Hynix XR | Wafer Production Line</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link type="text/css" rel="stylesheet" href="https://xrblocks.github.io/css/xr.css" />
    <style>
      /* Ensure the XR entry button is visible and at the front */
      xr-button, .xr-button-container {
        display: block !important;
        position: fixed !important;
        bottom: 30px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        z-index: 99999 !important;
      }

      #manual-xr-overlay {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100000;
        display: none;
      }
      
      .manual-start-btn {
        background: #f15a24;
        color: white;
        padding: 20px 50px;
        font-size: 24px;
        font-weight: bold;
        border: 4px solid white;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }

      #debug-log {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.7);
        color: #00ff00;
        padding: 12px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        z-index: 9999;
        pointer-events: none;
        border-radius: 4px;
        border: 1px solid #f15a24;
        max-width: 280px;
      }
    </style>
    <script>
      window.litDisableBundleWarning = true;
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
          "troika-three-text": "https://cdn.jsdelivr.net/gh/protectwise/troika@028b81cf308f0f22e5aa8e78196be56ec1997af5/packages/troika-three-text/src/index.js",
          "troika-three-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-three-utils/src/index.js",
          "troika-worker-utils": "https://cdn.jsdelivr.net/gh/protectwise/troika@v0.52.4/packages/troika-worker-utils/src/index.js",
          "bidi-js": "https://esm.sh/bidi-js@%5E1.0.2?target=es2022",
          "webgl-sdf-generator": "https://esm.sh/webgl-sdf-generator@1.1.1/es2022/webgl-sdf-generator.mjs",
          "lit": "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js",
          "lit/": "https://esm.run/lit@3/",
          "xrblocks": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/xrblocks.js",
          "xrblocks/addons/": "https://cdn.jsdelivr.net/npm/xrblocks@0.12.0/build/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="debug-log">System: SK Hynix Fab Core v5.0 (Clean View)...</div>

    <!-- Manual Fallback Button -->
    <div id="manual-xr-overlay">
      <button class="manual-start-btn" id="force-start">ENTER FABRICATION</button>
    </div>

    <script type="module">
      import 'xrblocks/addons/simulator/SimulatorAddons.js';
      import * as THREE from 'three';
      import * as xb from 'xrblocks';

      const log = (msg) => {
        const el = document.getElementById('debug-log');
        if (el) el.innerHTML += `<br>> ${msg}`;
        console.log(`[HynixLog] ${msg}`);
      };

      class FactoryScript extends xb.Script {
        constructor() {
          super();
          this.items = [];
          this.conveyorSpeed = 0.02;
          this.isStopped = false;
          this.productionCount = 0;
          this.time = 0;
          this.lookTarget = new THREE.Vector3();
        }

        init() {
          log("Configuring fabrication environment...");
          
          // Environment Lighting
          this.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.8));
          const sun = new THREE.DirectionalLight(0xffffff, 2);
          sun.position.set(5, 10, 5);
          sun.castShadow = true;
          this.add(sun);

          // 1. Create transparent background hall
          this.createBackgroundHall();
          // 2. Conveyor belt
          this.createConveyor();

          // 3. Initialize production items
          for (let i = 0; i < 8; i++) {
            this.createProductionItem(i * 1.5 - 10.0);
          }

          // 4. Mechanical components
          this.createRoboticArm();
          this.createControlPanel();
          this.createHumanoidRobot();
          
          log("Status: PRODUCTION READY");
        }

        createBackgroundHall() {
          const hall = new THREE.Group();
          
          // Floor: 90% transparent for AR
          const floorGeo = new THREE.PlaneGeometry(60, 60);
          const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x000000, 
            transparent: true, 
            opacity: 0.1, 
            roughness: 1.0 
          });
          const floor = new THREE.Mesh(floorGeo, floorMat);
          floor.rotation.x = -Math.PI / 2;
          floor.receiveShadow = true;
          hall.add(floor);

          // Back Wall: 90% transparent
          const wallMat = new THREE.MeshStandardMaterial({ 
            color: 0x000000, 
            transparent: true, 
            opacity: 0.1 
          });
          const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 25), wallMat);
          wall.position.set(0, 12, -15);
          hall.add(wall);
          
          this.add(hall);
        }

        createConveyor() {
          const group = new THREE.Group();
          const belt = new THREE.Mesh(
            new THREE.BoxGeometry(1.4, 0.2, 16.0),
            new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8 })
          );
          belt.position.set(0, 0.5, -7.5); 
          group.add(belt);

          this.laser = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 0.02, 0.02),
            new THREE.MeshBasicMaterial({ color: 0xff0000 })
          );
          this.laser.position.set(0, 0.95, -2.5);
          group.add(this.laser);
          this.add(group);
        }

        createProductionItem(zPos) {
          const isFoup = Math.random() > 0.4;
          const item = new THREE.Group();
          if (isFoup) {
            const outerShell = new THREE.Mesh(
              new THREE.BoxGeometry(0.45, 0.45, 0.45),
              new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.4, metalness: 0.9, roughness: 0.1 })
            );
            item.add(outerShell);
            const innerBase = new THREE.Mesh(
              new THREE.BoxGeometry(0.4, 0.05, 0.4),
              new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 1 })
            );
            innerBase.position.y = -0.2;
            item.add(innerBase);
            const waferGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.002, 32);
            const waferMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 1.0, roughness: 0.1, emissive: 0x001133 });
            for(let i=0; i<8; i++) {
                const w = new THREE.Mesh(waferGeo, waferMat);
                w.position.y = -0.15 + (i * 0.04);
                item.add(w);
            }
          } else {
            const frame = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.45, 0.1), new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 1 }));
            frame.position.z = -0.15;
            item.add(frame);
            const waferGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.005, 32);
            const waferMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 1.0, roughness: 0.0 });
            const w = new THREE.Mesh(waferGeo, waferMat);
            w.rotation.x = Math.PI / 2;
            item.add(w);
          }
          item.position.set(0, 0.85, zPos);
          this.add(item);
          this.items.push(item);
        }

        createHumanoidRobot() {
          this.robot = new THREE.Group();
          this.robot.position.set(-1.2, 0, -2.5); 
          this.robot.rotation.y = Math.PI / 3;
          const metalMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9, roughness: 0.1 });
          const jointMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
          const torso = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.5, 0.2), metalMat);
          torso.position.y = 1.1;
          this.robot.add(torso);
          this.robotHead = new THREE.Group();
          this.robotHead.position.y = 1.45;
          const headBox = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.2, 0.18), metalMat);
          this.robotHead.add(headBox);
          const visor = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.1), new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: 0x00ccff, emissiveIntensity: 2 }));
          visor.position.set(0, 0.05, 0.08);
          this.robotHead.add(visor);
          this.robot.add(this.robotHead);
          this.add(this.robot);
        }

        createRoboticArm() {
          this.armRoot = new THREE.Group();
          this.armRoot.position.set(1.0, 0.5, -4.5);
          const base = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3), new THREE.MeshStandardMaterial({color: 0x444444}));
          this.armRoot.add(base);
          this.joint = new THREE.Group();
          this.joint.position.y = 0.2;
          this.armRoot.add(this.joint);
          const seg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.3, 0.12), new THREE.MeshStandardMaterial({color: 0xffd700}));
          seg.position.y = 0.65;
          this.joint.add(seg);
          this.add(this.armRoot);
        }

        createControlPanel() {
          const panel = new xb.SpatialPanel({ width: 1.4, height: 1.0, backgroundColor: '#000000f0' });
          panel.position.set(-1.8, 1.8, -3.5);
          panel.rotation.y = 0.55;
          this.add(panel);
          const grid = panel.addGrid();
          grid.addRow({weight: 0.3}).addText({ text: 'SK HYNIX FAB OS\nRemote Monitoring', fontSize: 0.08, fontColor: '#f15a24' });
          this.statDisplay = grid.addRow({weight: 0.3}).addText({ text: 'STATUS: MONITORING\nPROCESSED: 0 WAFERS', fontSize: 0.05 });
          const btns = grid.addRow({weight: 0.4});
          btns.addCol({weight: 0.5}).addTextButton({ text: 'PAUSE', backgroundColor: '#ed1c24', fontSize: 0.12 }).onTriggered = () => { this.isStopped = !this.isStopped; };
          btns.addCol({weight: 0.5}).addTextButton({ text: 'BOOST', backgroundColor: '#388e3c', fontSize: 0.12 }).onTriggered = () => { this.conveyorSpeed = Math.min(this.conveyorSpeed + 0.03, 0.25); };
        }

        update() {
          if (this.isStopped) return;
          const dt = xb.getDeltaTime();
          this.time += dt;

          let nearestItem = null;
          let minDistance = Infinity;

          this.items.forEach(item => {
            item.position.z += this.conveyorSpeed;
            const dist = Math.abs(item.position.z - this.robot.position.z);
            if (dist < minDistance) {
              minDistance = dist;
              nearestItem = item;
            }
            if (item.position.z > 2.0) {
              item.position.z = -10.0;
              this.productionCount++;
              if (this.statDisplay) this.statDisplay.setText(`STATUS: LINE ACTIVE\nPROCESSED: ${this.productionCount} WAFERS`);
            }
          });

          if (this.robotHead && nearestItem) {
            this.lookTarget.set(nearestItem.position.x, nearestItem.position.y, nearestItem.position.z);
            this.robotHead.lookAt(this.lookTarget);
            this.robotHead.rotation.x = Math.max(-0.3, Math.min(0.3, this.robotHead.rotation.x));
            this.robotHead.rotation.y += Math.PI; 
          }

          if (this.joint) {
            this.joint.rotation.y = Math.sin(this.time * 0.7) * 1.4;
            this.joint.rotation.x = Math.cos(this.time * 1.1) * 0.4;
          }
          if (this.conveyorSpeed > 0.02) this.conveyorSpeed -= 0.0002;
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        const options = new xb.Options();
        
        options.enableUI();
        options.enableHands();
        options.enableReticles();
        
        options.hands.enabled = true;
        options.hands.visualization = true;
        options.hands.visualizeMeshes = true;
        options.controllers.visualizeRays = true;
        
        options.xrButton.enabled = true;
        options.xrButton.startText = 'START FABRICATION';
        
        // High perspective for simulator
        options.simulator.cameraPosition = new THREE.Vector3(0, 3, 3);
        options.simulator.lookAt = new THREE.Vector3(0, 0, -3);

        xb.add(new FactoryScript());
        
        try {
          await xb.init(options);
          log("Secure OS linked. Passthrough and Clean View enabled.");
          
          setTimeout(() => {
            const xrBtn = document.querySelector('xr-button');
            if (!xrBtn) {
              const overlay = document.getElementById('manual-xr-overlay');
              overlay.style.display = 'block';
              document.getElementById('force-start').onclick = () => {
                const autoBtn = document.querySelector('xr-button');
                if (autoBtn) autoBtn.click();
              };
            }
          }, 3000);

        } catch (e) { log(`System Fault: ${e.message}`); }
      });
    </script>
  </body>
</html>
